[project]
name = "fastapi-agent-blueprint"
version = "0.10.1"
description = "FastAPI backend blueprint for AI agent apps: DDD domains, SQLAlchemy, Taskiq, RAG infra, and Claude/Codex collaboration harness"
readme = "README.md"
requires-python = ">=3.12.9"
keywords = [
    "fastapi",
    "backend-blueprint",
    "clean-architecture",
    "domain-driven-design",
    "dependency-injection",
    "ai-agents",
    "ai-assisted-development",
    "coding-agents",
    "llm",
    "rag",
    "backend-template",
    "fastapi-template",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "claude-code",
    "codex-cli",
    "taskiq",
    "nicegui",
    "pydantic-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14.3",
    "aiomysql>=0.2.0",
    "alembic>=1.15.2",
    "asgi-correlation-id>=4.3.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.3.0",
    "dependency-injector>=4.46.0",
    "email-validator>=2.0.0",
    "fastapi>=0.115.12",
    "greenlet>=3.2.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.12",
    "pydantic-settings>=2.14.2",
    "pymysql>=1.1.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.40",
    "structlog>=25.0.0",
    "taskiq[reload]>=0.12.1",
    "semantic-text-splitter>=0.17.0",
    "uvicorn>=0.34.1",
]

[project.optional-dependencies]
admin = ["nicegui>=3.12.0"]
# Kept installable after 0.9.0 removed it from core: nothing in the repo
# invokes gunicorn (the only mention is a commented-out block in
# run_server_local.py), but adopters who relied on the executable arriving
# with a plain install need a path that does not break.
server-gunicorn = ["gunicorn>=23.0.0"]
aws = [
    "aioboto3>=15.4.0",
    "boto3>=1.39.12",
    "types-aioboto3>=15.4.0",
    "types-aiobotocore-dynamodb>=2.25.0",
    "types-aiobotocore-s3>=2.25.0",
    "types-aiobotocore-s3vectors>=3.5.0",
]
sqs = ["taskiq-aws>=0.4.0"]
rabbitmq = ["taskiq-aio-pika>=0.4.0"]
openai = ["openai>=1.0.0", "tiktoken>=0.7.0"]
pydantic-ai = ["pydantic-ai-slim[openai]>=1.99.0,<2", "tiktoken>=0.7.0"]
pydantic-ai-anthropic = ["pydantic-ai-slim[anthropic]>=1.99.0,<2"]
pydantic-ai-google = ["pydantic-ai-slim[google]>=1.99.0,<2"]
pydantic-ai-duckduckgo = ["pydantic-ai-slim[duckduckgo]>=1.99.0,<2"]
otel = [
    "opentelemetry-api>=1.40.0",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40.0",
]

# Type checking. pyright was a declared dev dependency with zero invocation
# sites anywhere in the repo (#333) — the pre-commit mypy hook is
# `stages: [manual]`, so `pre-commit run --all-files` skipped it and the CI
# `architecture` job type-checked nothing at all.
#
# `include` was an allow-list of clean packages while the tree was being cleaned
# up (#381 steps 1-3). It now covers all of `src`, which is the stronger contract:
# a new file is checked from the moment it is written instead of waiting for
# someone to add its package here. Getting there took the measurements below.
#
# The count went 91 -> 0. Roughly half was repo code with real defects behind it
# (possibly-unbound locals, a wrong return type, `hasattr` used where it cannot
# narrow, an unguarded optional key in an S3 listing). The other half was AWS
# typing that nobody had wired up: `types-aioboto3` gives `Session.client()` its
# per-service overloads, without which every `async with ... .client()` resolved
# to an untypeable placeholder, and `types-aiobotocore-s3vectors` types the four
# s3vectors calls that had never been checked at all -- `S3VectorClient.client()`
# used to yield the generic `AioBaseClient`, whose `__getattr__` always raises, so
# `await client.put_vectors(...)` read as "NoReturn is not awaitable".
#
# Nine suppressions remain, all in the two bootstrap modules and each with its
# cause written at the call site: dependency-injector's dynamic provider
# attributes, module-attribute injection, and Starlette's `add_exception_handler`
# handler signature. They are line- and rule-scoped, so everything else in those
# files is still checked.
#
# `reportUnnecessaryTypeIgnoreComment` would keep those suppressions from rotting
# and is the natural next ratchet, but it is not enabled here: it reports 3
# errors today, and 2 are mypy-only `# type: ignore` comments that pyright does
# not need. Removing those belongs with retiring the mypy hook (#375), not here.
#
# Never widen coverage by relaxing the rules below.
[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[project.urls]
Homepage = "https://github.com/Mr-DooSun/fastapi-agent-blueprint"
Repository = "https://github.com/Mr-DooSun/fastapi-agent-blueprint"
Issues = "https://github.com/Mr-DooSun/fastapi-agent-blueprint/issues"
Changelog = "https://github.com/Mr-DooSun/fastapi-agent-blueprint/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "anyio[asyncio]>=4.0.0",
    "locust>=2.37.11",
    "pip-audit>=2.10.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.408",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".agents/shared"]
markers = [
    "slow: spawns a subprocess per test — container wiring probes that cannot\n           run in-process (see tests/support/container_env.py)",
    "dynamodb: requires dynamodb-local at http://localhost:8000 (see make test-dynamo)",
]

# === Ruff Configuration ===
[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "UP",   # pyupgrade
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
]
ignore = [
    "F841",   # local variable assigned but never used
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top
    "F401",   # unused import
    "B008",   # function call in default argument
    "B006",   # mutable default argument
    "C901",   # too complex
    "SIM102", # use single if instead of nested if
    "SIM114", # combine if branches with same body
    "SIM117", # multiple with statements
    "SIM910", # use dict.get(key) instead of dict.get(key, None)
    "B904",   # raise without from inside except
    "UP046",  # non-PEP695 generic class
    "S113",   # request without timeout (was bandit B113)
    "S314",   # use of xml.etree.ElementTree (was bandit B314)
    "S413",   # use of pycrypto (was bandit B413)
    "S607",   # starting process with partial executable path
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"**/routers/*.py" = ["B008"]
"**/workflows/*.py" = ["B006"]
"tests/**/*.py" = ["S"]
"*_test.py" = ["S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
